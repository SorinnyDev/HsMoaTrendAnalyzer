<script type="text/javascript" >
require ([
		'common/cjos/util/configUtil'
	], function (
			configUtil
		) {
		
		function initView() {
			var protocol = location.protocol;
			var infolwInfoCookieStr = Cookies.get('INFLOW_INFO') || '';
			
			if ( infolwInfoCookieStr === '' ) {
				return;
			}
			var partnerCd = infolwInfoCookieStr.split('|,^')[1];
			var iframeHeight = '0px';
			
			// https 지원되지 않는 외부 제휴 헤더 ssl 페이지에서 노출되지 않도록 처리
			if ( ( partnerCd == '2541' || partnerCd == '2430' || partnerCd == '0934' ) && protocol === 'https:' ) {
				return;
			}
			
			try {
				switch ( partnerCd ) {
					case '2034':
						// 01. 신한카드
						iframeHeight = '110px';
						break;
					case '1993':
					case '2045':
					case '2677':
						// 02. 현대카드
						iframeHeight = '80px';
						break;
					case '1989':
					case '2044':
						// 03. 삼성카드
						iframeHeight = '115px';
						break;
					case '2541':
						// 04. NH카드
						iframeHeight = '95px';
						break;
					case '2429':
					case '3266':
						// 05. KB국민카드
						iframeHeight = '110px';
						break;
					case '2430':
						// 06. 하나 SK카드
						iframeHeight = '148px';
						break;
					case '0934':
						// 07. 드림엑스
						iframeHeight = '84px';
						break;
					case '2056':
						// 08. 오케이캐쉬백몰
						iframeHeight = '92px';
						break;
					case '2038':
					case '2046':
						// 09. 아시아나
						iframeHeight = '55px';
						break;
					default:
						break;
				}
			}  catch ( e ) {
				console.log ( e );
			}
			
			if (iframeHeight === '0px') {
				return;
			}
			
			var iframe = window.document.createElement ('iframe');
			iframe.width = '100%';
			iframe.height=iframeHeight;
			iframe.id = 'affiliateHeaderIframe';
			iframe.src = configUtil.get('ecBaseUrlNoProtocol') + '/p/advertise/inflow/affiliate/iframe';
			iframe.style = 'display:block; frameBorder="0"';
			iframe.scrolling = 'no';
			
			$("#affiliateHeader").append (iframe);
		}
		
		initView ();
	});
</script>
<script type="text/javascript" >
	// GA360 Key prepare
	GtmLib.prepare(["eigene_item", "dimension57", "dimension58", "dimension59", "dimension60", "dimension61", "dimension62", "dimension66", "dimension67", "dimension68", "dimension70", "dimension71", "dimension72", "dimension73", "dimension74", "dimension77", "dimension78", "dimension79", "dimension80", "dimension81", "dimension123", "dimension124", "dimension128"]);
	require ([
		'common/cjmall/ui/p/header/views/headerView',
		'common/cjmall/ui/p/footer/views/footerView',
		'common/cjos/advertise/util/advertiseUtil',
		'common/cjos/advertise/models/advertiseConstantsModel',
		'page/cjmall/item/p/views/itemMainView',
		'common/cjos/advertise/util/advertiseUtil',
		'common/cjos/advertise/models/advertiseConstantsModel',
		'common/cjos/util/configUtil',
		'common/cjos/util/globalVariables',
		'page/cjmall/item/models/itemWaitingModel',
		'page/cjmall/item/p/views/itemWaitingView',
		'page/cjmall/item/p/views/soldoutLayerView',
		'page/cjmall/item/models/itemKeyValueModel',
		'common/cjos/util/dateUtil',
		'common/cjos/logger/utils/loggerUtil'
	], function (
				HeaderView,
				FooterView,
				advertiseUtil,
				AdvertiseConstants,
				ItemMainView,
				advertiseUtil,
				AdvertiseConstants,
				configUtil,
				globalVariables,
				ItemWaitingModel,
				ItemWaitingView,
				SoldoutLayerView,
				ItemKeyValueModel,
				dateUtil,
				loggerUtil
	) {

		function initView () {
			var s = this;
		
			function initViewRender() {
				// 넷퍼넬 구동 시까지 setKey를 itemMain.jsp 로 옮김!
				advertiseUtil.advertiseSetKey (AdvertiseConstants.PAGE_TYPE);
				advertiseUtil.advertiseSetKey (AdvertiseConstants.ITEM_ARRAY);
				
				var actionId = null;
				var netfunnelItems = model.get('eventItemCode'); // '2033768389|2033766955|2033765678|2033764982|2033768592';

				// - 데이터 파싱 후 itemCode 포함여부 체크
				var _netfunnelItems = (function() {
					try {
						var parsed = JSON.parse(netfunnelItems || '[]');
						return Array.isArray(parsed) ? parsed : [];
					} catch (e) {
						cjosLogUtil.log('대용량 트래픽: 이벤트 상품 파싱 에러', netfunnelItems);
						return [];
					}
				})();

				// itemCode와 일치하는 오브젝트 추출
				var _target = null
				if (Array.isArray(_netfunnelItems) && _netfunnelItems.length > 0) {
					for (var i = 0; i < _netfunnelItems.length; i++) {
						var info = _netfunnelItems[i];
						var isPlainObj = info && typeof info === 'object' && !Array.isArray(info);
						if (isPlainObj && info.code === __cjos_config__.itemCode) {
							_target = info;
							break;
						}
					}
				}

				// 넷퍼넬 적용 여부 판단
				if(_target !== null && _target !== undefined && typeof(_target) === 'object') {
					// action_id 저장
					actionId = _target.actionId || NetFunnel.TS_ACTION_ID;
					renderView(actionId);
				} else {
					// common ui
					var headerView = new HeaderView ({isActivatedTab: false});
					var footerView = new FooterView ();
					var view = new ItemMainView ();
				}
			};

			// 프레임원 웨이팅 페이지 노출 여부
			s.model = new ItemKeyValueModel();
			s.model.update();
			s.model.on('complete', initViewRender);
		}

		function renderView(actionId) {
			var s = this;
			
			var waitingUseYn = model.get('waitingVal');
			var netfunnelUseYn = model.get('netfunnelVal');
			var netfunnelUseItem = __cjos_config__.itemCode;
			
			var itemWaitingModel = new ItemWaitingModel();
			itemWaitingModel.fetch({
				xhrFields: {
					withCredentials: true
				},
				timeout : 10000,
				error : function() {
					// 새로고침 화면 추가 (api 에러나면 웨이팅 화면으로 노출)
					cjosLogUtil.log(s);
					var waitingView = new ItemWaitingView (null);
				},
				success: function(response) {
					if (response && response.get('status') === 200 && response.get('result')) {
						var result = response.get('result');

						// 공통 UI 생성 함수
						function renderCommonView() {
							var headerView = new HeaderView({ isActivatedTab: false });
							var footerView = new FooterView();
							var view = new ItemMainView();
						}

						// 넷퍼넬 실행 공통 함수
						function runNetFunnel(actionId) {
							globalVariables.set({
								netfunnelUseYn: netfunnelUseYn,
								netfunnelUseItem: netfunnelUseItem,
								netfunnelActionId: actionId
							});

							NetFunnel_Action({ action_id: actionId }, {
								success: function(ev, ret) {
									cjosLogUtil.log('netfunnel success!');
									var netfunnel_key = ret.data.key;
									renderCommonView();
								},
								continued: function(ev, ret) {
									cjosLogUtil.log('netfunnel continued!');
									//NetFunnel.PopupSetup("continue", ret, "mobileSkin");
								},
								stop: function(ev, ret) {
									cjosLogUtil.log('netfunnel stop!');
									if (history && history.length > 1 &&
										document.referrer &&
										document.referrer.indexOf('.cjonstyle.com') > -1 &&
										!/\/c\/inflow\/I\d{4}/.test(document.referrer)) {
										history.back();
									} else {
										location.href = configUtil.get('ecDisplayUrl') +
											'/p/homeTab/main?hmtabMenuId=003147&rPIC=homeonstyle';
									}
								},
								error: function(ev, ret) {
									cjosLogUtil.log('netfunnel error!');
									var waitingView = new ItemWaitingView(null);
									loggerUtil.splunkClickLog('netfuunel Error - PC / errorCode : ' + ret.code);
								},
								block: function(ev, ret) {
									cjosLogUtil.log('netfunnel block!');
								}
							});
						}

						// 진입판단
						if (result && (!result.hasStock || (result.hasStock && result.resultCode === '00'))) {
							// 재고없음 or (재고있음 + 미오픈(00))
							if (waitingUseYn) {
								var waitingView = new ItemWaitingView(result);
							} else if (netfunnelUseYn) {
								runNetFunnel(actionId);
							} else {
								renderCommonView();
							}
						} else {
							// 그 외 (재고 있음 + 정상코드)
							if (netfunnelUseYn) {
								runNetFunnel(actionId);
							} else {
								renderCommonView();
							}
						}
					}
				}
			});
		}

		initView ();
	});
</script>

				GtmLib.setData("dimension8", null);
				GtmLib.setData("dimension9", null);
				GtmLib.setData("dimension10", "N");
				GtmLib.setData("dimension11", null);
				GtmLib.setData("dimension13", "N");
				GtmLib.setData("dimension35", "N");
			}

			var waitingYn = configUtil.get ( 'waitingYn' ) == 'true' ? true : false ;
			var itemCode = configUtil.get ( 'itemCode' );
			var netfunnelItem = configUtil.get ( 'netfunnelItem' );

			if(waitingYn && (itemCode === netfunnelItem)) {
				setDefault();
			} else {
                loginInfo.get(function (info) {
                    if(info.isDone) {
                        GtmLib.setData("dimension3", info['accountCreatedAt']);
                        GtmLib.setData("dimension6", info['custNo']);
                        GtmLib.setData("dimension7", (!info['gender']) ? null : (info['gender'] == "MALE") ? "M" : "F"); // 성별
                        GtmLib.setData("dimension8", info['age']);
                        GtmLib.setData("dimension9", info['segCd']);
                        GtmLib.setData("dimension10", (info['isAutoLoggedIn']) ? "Y" : "N");
                        GtmLib.setData("dimension11", (info['isCJOneMember'] == null) ? null : (info['isCJOneMember']) ? "Y" : "N");
                        GtmLib.setData("dimension13", (info['isEmployee']) ? "Y" : "N");
                        GtmLib.setData("dimension35", (info['isLoggedIn']) ? "Y" : "N");
                    } else {
                        setDefault();
                    }
                });
			}
		});
</script>
</body>
</html>
