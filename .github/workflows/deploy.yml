name: Deploy HsMoaTrendAnalyzer to K12

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Git Pull Latest Changes
        working-directory: C:\Project\Python_HQ\HsMoaTrendAnalyzer
        shell: powershell
        run: |
          git pull origin main

      - name: Docker Rebuild & Restart
        working-directory: C:\Project\Python_HQ\HsMoaTrendAnalyzer
        shell: powershell
        run: |
          docker compose up -d --build
